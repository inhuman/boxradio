name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build linux binary
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o boxradio .

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "boxradio,index.html,app.js,style.css,favicon.svg"
          target: ${{ secrets.DEPLOY_PATH }}/incoming

      - name: Install and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x incoming/boxradio
            mv -f incoming/boxradio boxradio
            mv -f incoming/index.html incoming/app.js incoming/style.css incoming/favicon.svg .
            rmdir incoming
            sudo systemctl restart boxradio
            # TLS: issue on first deploy, no-op while valid, reissue when expired.
            # Press "re-run deploy" after a cert expires to regenerate it.
            if [ -n "${{ secrets.DOMAIN }}" ]; then
              sudo certbot certonly --nginx -d ${{ secrets.DOMAIN }} \
                --non-interactive --agree-tos -m ${{ secrets.LE_EMAIL }} \
                --keep-until-expiring && sudo systemctl reload nginx
            fi
